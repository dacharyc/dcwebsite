StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = DC

# Skill files are agent instructions, not published prose; em dashes are fine there.
[.claude/**/*.md]
DC.EmDash = NO

# Microblog posts are short posts written for LinkedIn first; the backfilled ones are
# historical and not worth re-editing to the article style.
[content/microblog/*.md]
DC.EmDash = NO
DC.AdverbDensity = NO
DC.FillerPhrases = warning
DC.HedgingPhrases = warning
DC.AICompoundPhrases = warning
DC.OpeningCliches = warning
DC.ContrastiveFormulas = warning
DC.SycophancyMarkers = warning
DC.Vocabulary = warning

# CLAUDE.md is agent instructions, like the skill files; em dashes are fine there.
[CLAUDE.md]
DC.EmDash = NO

# Markdown output templates are Hugo templates, not prose.
[layouts/**/*.md]
DC.EmDash = NO
