StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = DC

# Skill files are agent instructions, not published prose; em dashes are fine there.
[.claude/**/*.md]
DC.EmDash = NO

# Microblog posts get the full DC rule set; there is deliberately no section for them.
# AdverbDensity's default level (warning) is the right one for short posts, and Vale
# scopes `= NO` per glob but applies a level like `= warning` to every file, so a
# per-directory level override would leak site-wide. The backfilled historical posts
# would fail several rules, but they are not expected to be edited again.

# CLAUDE.md is agent instructions, like the skill files; em dashes are fine there.
[CLAUDE.md]
DC.EmDash = NO

# Markdown output templates are Hugo templates, not prose.
[layouts/**/*.md]
DC.EmDash = NO

# Drafts are work in progress; lint them when they are promoted into content/posts/.
# Vale has no style-level wildcard (DC.* = NO is ignored), so each rule is listed.
[content/drafts/*.md]
DC.EmDash = NO
DC.AdverbDensity = NO
DC.FillerPhrases = NO
DC.HedgingPhrases = NO
DC.AICompoundPhrases = NO
DC.OpeningCliches = NO
DC.ContrastiveFormulas = NO
DC.SycophancyMarkers = NO
DC.Vocabulary = NO
